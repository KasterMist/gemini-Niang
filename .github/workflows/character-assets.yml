name: Gemini character assets
on:
  push:
    paths: ['assets/characters/gemini/**', 'antigravity/**', 'desktop/**', 'preview/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/character-assets.yml']
  pull_request:
    paths: ['assets/characters/gemini/**', 'antigravity/**', 'desktop/**', 'preview/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/character-assets.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
